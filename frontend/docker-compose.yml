services:
  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    depends_on:
      - frontend-prod
    ports:
      - "80:8080"
      - "443:8443"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
    secrets:
      - nginx_tls_cert
      - nginx_tls_key
    networks:
      - frontend_public
      - frontend_api

  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_MODE: mock
      VITE_HISTORY_MODE: local
      VITE_API_BASE_URL: http://localhost:8080
      VITE_DEFAULT_MODEL: default
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev
    networks:
      - frontend_public
      - frontend_api

  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_MODE: ${VITE_API_MODE:-mock}
        VITE_HISTORY_MODE: ${VITE_HISTORY_MODE:-local}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_DEFAULT_MODEL: ${VITE_DEFAULT_MODEL:-default}
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend_api

  frontend-e2e:
    image: mcr.microsoft.com/playwright:v1.59.1-noble
    working_dir: /app
    environment:
      VITE_API_MODE: mock
      VITE_HISTORY_MODE: local
      VITE_API_BASE_URL: http://localhost:8080
      VITE_DEFAULT_MODEL: default
      CI: "true"
    volumes:
      - .:/app
      - frontend_e2e_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run test:e2e"
    networks:
      - frontend_public

volumes:
  frontend_node_modules:
  frontend_e2e_node_modules:

secrets:
  nginx_tls_cert:
    file: ./certs/local.crt
  nginx_tls_key:
    file: ./certs/local.key

networks:
  frontend_public:
    driver: bridge
  frontend_api:
    driver: bridge
  backend_private:
    driver: bridge
    internal: true
