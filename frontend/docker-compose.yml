services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_MODE: mock
      VITE_HISTORY_MODE: local
      VITE_API_BASE_URL: http://localhost:8080
      VITE_DEFAULT_MODEL: default
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev

  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_MODE: ${VITE_API_MODE:-mock}
        VITE_HISTORY_MODE: ${VITE_HISTORY_MODE:-local}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_DEFAULT_MODEL: ${VITE_DEFAULT_MODEL:-default}
    ports:
      - "8080:80"

  frontend-e2e:
    image: mcr.microsoft.com/playwright:v1.59.1-noble
    working_dir: /app
    environment:
      VITE_API_MODE: mock
      VITE_HISTORY_MODE: local
      VITE_API_BASE_URL: http://localhost:8080
      VITE_DEFAULT_MODEL: default
      CI: "true"
    volumes:
      - .:/app
      - frontend_e2e_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run test:e2e"

volumes:
  frontend_node_modules:
  frontend_e2e_node_modules:
