services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_MODE: mock
      VITE_HISTORY_MODE: local
      VITE_API_BASE_URL: http://localhost:8080
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev

volumes:
  frontend_node_modules:
