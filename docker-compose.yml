services:
  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./frontend/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_MODE: real
        VITE_HISTORY_MODE: local
        VITE_API_BASE_URL: ""
        VITE_DEFAULT_MODEL: default
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - app_network

  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
      OLLAMA_TIME_OUT: "300"
      OLLAMA_NUM_PREDICT: "256"
      ENABLE_MCP_TOOLS: "true"
      APP_TIMEZONE: Europe/Moscow
      MEMORY_CONTEXT_CHAR_BUDGET: "24000"
      MEMORY_RECENT_MESSAGES: "12"
      MEMORY_SUMMARY_TARGET_CHARS: "4000"
      CORS_ALLOW_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    expose:
      - "8080"
    ports:
      - "8000:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - app_network

  ollama:
    build:
      context: ./app/model
      dockerfile: Dockerfile
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 30m
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
